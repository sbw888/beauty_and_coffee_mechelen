<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beauty &amp; Coffee is verhuisd</title>
<meta name="robots" content="noindex">
<!-- Without JavaScript: plain redirect (stamps are not carried over then) -->
<meta http-equiv="refresh" content="3; url=https://beautyandcoffeemechelen.github.io/">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F6F0E6;
        font-family:Georgia, serif; color:#2C1E16; text-align:center; padding:24px; box-sizing:border-box; }
  a{ color:#8A5A2B; }
</style>
<script>
/* Beauty & Coffee moved to a new address.
   This page sends visitors there, and takes the client's stamp card,
   favourites and discoveries along (browser storage belongs to one
   address, so it would otherwise stay behind here).
   Change NEW_URL if the new address is different. */
(function(){
  var NEW_URL = "https://beautyandcoffeemechelen.github.io/";
  var params = new URLSearchParams(location.search);
  try {
    var data = localStorage.getItem("beautyCoffeeLocal_v1");
    if (data){
      var b64 = btoa(unescape(encodeURIComponent(data))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      params.set("migrate", b64);
    }
  } catch(e){}
  // stop the old app from being served from the phone's cache
  try {
    if ("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
    }
    if (window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
  } catch(e){}
  var qs = params.toString();
  location.replace(NEW_URL + (qs ? "?" + qs : "") + location.hash);
})();
</script>
</head>
<body>
  <p>☕ Beauty &amp; Coffee is verhuisd naar<br><a href="https://beautyandcoffeemechelen.github.io/">beautyandcoffeemechelen.github.io</a></p>
</body>
</html>
